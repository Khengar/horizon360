version: '3.8'

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: horizon_db
      POSTGRES_USER: horizon_user
      POSTGRES_PASSWORD: horizon_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Note: Internal network connects web/worker via db:5432; host port binding omitted to avoid conflicts.

  redis:
    image: redis:7-alpine
    # Note: Internal network connects web/worker via redis:6379; host port binding omitted to avoid conflicts.

  web:
    build: .
    command: >
      bash -c "python manage.py migrate &&
               python setup_demo.py &&
               python manage.py runserver 0.0.0.0:8000"
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DB_NAME=horizon_db
      - DB_USER=horizon_user
      - DB_PASSWORD=horizon_password
      - DB_HOST=db
      - DB_PORT=5432
      - CELERY_BROKER_URL=redis://redis:6379/0
    depends_on:
      - db
      - redis

  worker:
    build: .
    command: celery -A horizon360 worker -l info
    volumes:
      - .:/app
    env_file:
      - .env
    environment:
      - DB_NAME=horizon_db
      - DB_USER=horizon_user
      - DB_PASSWORD=horizon_password
      - DB_HOST=db
      - DB_PORT=5432
      - CELERY_BROKER_URL=redis://redis:6379/0
    depends_on:
      - db
      - redis

  frontend:
    build:
      context: ./frontend
    ports:
      - "1420:80"
    depends_on:
      - web

volumes:
  postgres_data:
